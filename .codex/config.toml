# Config Codex du projet (chargée seulement si le projet est "trusted" dans ~/.codex/config.toml).
# Instructions : AGENTS.md à la racine. Modèle volontairement non figé (défaut de Codex).

# Sandbox et approbations : hérités de ~/.codex/config.toml (profils de permissions).
# Ne pas remettre sandbox_mode ici : il désactive ces profils.
model_reasoning_effort = "high"
web_search = "live"

[mcp_servers.astro-docs]
url = "https://mcp.docs.astro.build/mcp"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"
